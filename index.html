<!doctype html>

<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ハクスラRPG</title>
<style>
body{margin:0;background:#10131b;color:#eef2ff;font-family:system-ui,sans-serif} .app{max-width:1100px;margin:auto;padding:14px}.panel{background:#181e2b;border:1px solid #30384c;border-radius:14px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}button,select{background:#252d3f;color:#fff;border:1px solid #3d4860;border-radius:10px;padding:9px;font-weight:700}button:hover{border-color:#75e4ff}.tab.active{outline:2px solid #75e4ff}.card{background:#202739;border:1px solid #39445c;border-radius:12px;padding:10px}.equipped{border:2px solid #ffd166;box-shadow:0 0 16px #ffd16655}.small{color:#a8b0c2;font-size:12px}.log{background:#0b0f17;border:1px solid #30384c;border-radius:12px;padding:10px;max-height:240px;overflow:auto;line-height:1.7}.r0{color:#ddd}.r1{color:#72ff8c}.r2{color:#62b6ff}.r3{color:#bd8bff}.r4{color:#ff91c7}.r5{color:#ffb86b}.r6{color:#ffd166}.r7{color:#64ffe0}.r8{color:#ff5c5c}.r9{color:#f8ff66}.r10{color:#c084fc}.r11{color:#fb7185}.r12{color:#67e8f9}.r13{color:#a7f3d0}.r14{color:white;text-shadow:0 0 10px #fff,0 0 18px #ffd166}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #30384c;padding:6px;text-align:left}.hide{display:none}.danger{background:#3b1d28}.good{background:#173523}.gold{background:#3a3018;color:#ffe5a0}.bar{height:12px;background:#0b0f17;border-radius:99px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,#75e4ff,#b388ff)}
</style>
</head>
<body>
<div class="app">
<h1>ハクスラRPG</h1>
<div class="panel row">
<button class="tab active" onclick="show('home',this)">ホーム</button><button class="tab" onclick="show('dungeon',this)">ダンジョン</button><button class="tab" onclick="show('gacha',this)">ガチャ</button><button class="tab" onclick="show('equip',this)">装備</button><button class="tab" onclick="show('enhance',this)">強化</button><button onclick="save()">セーブ</button><button class="danger" onclick="resetGame()">初期化</button>
</div>
<div class="panel"><div id="stats" class="grid"></div></div>
<section id="home" class="screen"><div class="panel"><h2>ホーム</h2><div id="homeInfo" class="grid"></div></div><div class="panel"><h2>現在装備</h2><div id="equipNow" class="grid"></div></div></section>
<section id="dungeon" class="screen hide"><div class="panel"><h2>ダンジョン</h2><div class="row"><select id="dType" onchange="renderDungeon()"><option value="normal">ノーマル</option><option value="mat">強化素材</option><option value="gold">ゴールド</option><option value="cpu">CPU戦</option></select><select id="dLv"></select><button class="good" onclick="startDungeon()">挑戦</button></div><p id="dInfo" class="small"></p></div><div class="panel"><h2>戦闘</h2><div id="battle"></div><div id="battleBtns" class="row"></div></div><div class="panel"><h2>ログ</h2><div id="log" class="log"></div></div></section>
<section id="gacha" class="screen hide"><div class="grid"><div class="panel"><h2>ガチャ</h2><div id="gachaInfo"></div><div class="row"><button onclick="gacha(1)">1連</button><button onclick="gacha(10)">10連</button><button onclick="gacha(50)">50連</button><button class="gold" onclick="gacha(100)">100連</button></div><p class="small">1回100G。ガチャLvが上がると低レアが0%になり、高レアに寄る。</p><div class="row"><span>自動売却</span><select id="autoSell" onchange="G.autoSell=+this.value;draw()"></select></div></div><div class="panel"><h2>排出率</h2><table><tbody id="rates"></tbody></table></div></div><div class="panel"><h2>結果</h2><div id="gachaLog" class="log"></div></div></section>
<section id="equip" class="screen hide"><div class="panel"><h2>装備一覧</h2><div class="row"><select id="slotFilter" onchange="drawEquip()"></select><select id="sort" onchange="drawEquip()"><option value="rarity">レアリティ</option><option value="power">総合力</option><option value="hp">HP</option><option value="atk">攻撃</option><option value="def">防御</option><option value="luck">運</option><option value="crit">クリ率</option><option value="combo">連撃率</option><option value="goldB">獲得ゴールド</option><option value="expB">獲得経験値</option><option value="new">入手順</option></select><button class="danger" onclick="bulkSell()">○レア以下一括売却</button></div><div id="equipList" class="grid"></div></div></section>
<section id="enhance" class="screen hide"><div class="grid"><div class="panel"><h2>素材</h2><div id="mats"></div></div><div class="panel"><h2>装備強化</h2><select id="enhanceSel" onchange="drawEnhance()" style="width:100%"></select><div id="enhanceBox"></div></div></div></section>
</div>
<script>
const KEY='hackslash_rpg_v2';
const slots=['武器','頭','体','足','腕','アクセサリー','オーラ','ペット','羽','紋章'];
const R=['ノーマル','レア','ハイレア','Sレア','SSレア','エピック','レジェンド','ミシック','ゴッド','エンシェント','ファントム','カオス','セレスティアル','インフィニティ','オリジン'];
const M=[1,10,100,1000,10000,100000,1000000,10000000,100000000,1000000000,10000000000,100000000000,1000000000000,10000000000000,100000000000000];
const baseRates=[58,25,10,4,2,.7,.15,.01,.004,.1024,.0256,.0064,.0016,.0004,.0001];
const zeroLv=[10,25,50,100,200,350,500,750,1000];
const matNames=['下級強化石','中級強化石','上級強化石','超級強化石','神級強化石'];
let G=load(),B=null;
function fresh(){let eq={};slots.forEach(s=>eq[s]=null);return{gold:3000,lv:1,exp:0,maxD:1,gLv:1,gExp:0,autoSell:-1,id:1,equips:[],eq,mat:[0,0,0,0,0],best:0,log:['ゲーム開始']}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(G));msg('セーブしました')}
function resetGame(){if(confirm('初期化する？')){localStorage.removeItem(KEY);G=fresh();starter();draw()}}
function starter(){if(G.equips.length)return;let w=makeEq(0,'武器','初期'),a=makeEq(0,'体','初期');G.equips.push(w,a);G.eq['武器']=w.id;G.eq['体']=a.id}
starter();
function f(n){if(n<1000000)return Math.floor(n).toLocaleString();let u=['','万','億','兆','京','垓'],i=0;while(n>=10000&&i<u.length-1){n/=10000;i++}return n.toFixed(n>=100?0:n>=10?1:2)+u[i]}
function rc(i){return 'r'+i} function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function show(id,btn){document.querySelectorAll('.screen').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');draw()}
function rates(){let r=[...baseRates];zeroLv.forEach((lv,i)=>{if(G.gLv>=lv)r[i]=0});let t=Math.min(1,G.gLv/1000);[[9,75],[10,20],[11,4],[12,.8],[13,.19],[14,.01]].forEach(([i,v])=>r[i]=baseRates[i]+(v-baseRates[i])*t);let s=r.reduce((a,b)=>a+b,0);return r.map(x=>x*100/s)}
function rollRate(){let r=rates(),x=Math.random()*100;for(let i=0;i<r.length;i++){x-=r[i];if(x<=0)return i}return 14}
function needG(){return Math.floor(50+G.gLv*G.gLv*8)}
function addGExp(n){G.gExp+=n;while(G.gExp>=needG()){G.gExp-=needG();G.gLv++;glog('ガチャLv '+G.gLv+' に上昇！')}}
function makeEq(r,slot=rnd(slots),src='ガチャ'){let v=.9+Math.random()*.2,sm=src==='ボス'?1.3:src==='CPU'?1.45:1,b=M[r]*v*sm;let st={hp:Math.floor(b*(slot==='体'?12:3)),atk:Math.floor(b*(slot==='武器'?3.5:.7)),def:Math.floor(b*(slot==='紋章'?2.5:.5)),luck:Math.floor(b*(slot==='頭'?2.2:.4)),speed:+((slot==='足'||slot==='羽'?.08:0)+Math.random()*.04).toFixed(3),combo:+((slot==='ペット'?4:0)+Math.random()*2).toFixed(2),crit:+((slot==='腕'?5:0)+Math.random()*3).toFixed(2),expB:+((slot==='オーラ'?10:0)+Math.random()*3).toFixed(2),goldB:+((slot==='アクセサリー'?10:0)+Math.random()*3).toFixed(2)};return{id:G.id++,name:src+' '+R[r]+'の'+slot,slot,rarity:r,src,st,plus:0,lock:false,t:Date.now()+Math.random()}}
function emul(p){return 1+p*.12+p*p*.01}
function eqBy(id){return G.equips.find(e=>e.id===id)}
function pwr(e){let m=emul(e.plus);return e.st.hp*.2*m+e.st.atk*5*m+e.st.def*3*m+e.st.luck*2*m+e.st.speed*1000+e.st.combo*2000+e.st.crit*1500+e.st.expB*300+e.st.goldB*300}
function sellVal(e){return Math.floor(M[e.rarity]*(1+e.plus*.2)*(e.src==='ボス'?1.8:e.src==='CPU'?2.2:1))}
function stats(){let s={hp:100,atk:12,def:5,luck:3,speed:1,combo:0,crit:5,expB:0,goldB:0};slots.forEach(sl=>{let e=eqBy(G.eq[sl]);if(e){let m=emul(e.plus);s.hp+=e.st.hp*m;s.atk+=e.st.atk*m;s.def+=e.st.def*m;s.luck+=e.st.luck*m;s.speed+=e.st.speed;s.combo+=e.st.combo;s.crit+=e.st.crit;s.expB+=e.st.expB;s.goldB+=e.st.goldB}});return s}
function gacha(n){let cost=n*100;if(G.gold<cost)return alert('ゴールド不足');G.gold-=cost;addGExp(n);let cnt=Array(R.length).fill(0),sold=0,best=0,keep=0;for(let i=0;i<n;i++){let r=rollRate();cnt[r]++;best=Math.max(best,r);G.best=Math.max(G.best,r);let e=makeEq(r);if(r<=G.autoSell)sold+=sellVal(e);else{G.equips.push(e);keep++}}G.gold+=sold;trim();glog(`${n}連：最高 <span class="${rc(best)}">${R[best]}</span> / 獲得${keep}個 / 自動売却 +${f(sold)}G<br>`+cnt.map((c,i)=>c?`<span class="${rc(i)}">${R[i]}</span>:${c}`:'').filter(Boolean).join(' / '));draw()}
function trim(){let cap=500;if(G.equips.length<=cap)return;let used=new Set(Object.values(G.eq));let list=G.equips.filter(e=>!used.has(e.id)&&!e.lock).sort((a,b)=>pwr(a)-pwr(b));let sold=0;while(G.equips.length>cap&&list.length){let e=list.shift();sold+=sellVal(e);G.equips=G.equips.filter(x=>x.id!==e.id)}G.gold+=sold;if(sold)msg('所持上限超過で自動売却 +'+f(sold)+'G')}
function renderDungeon(){let t=document.getElementById('dType').value,sel=document.getElementById('dLv'),max=t==='normal'?G.maxD:Math.max(1,Math.floor(G.maxD/2)+1);sel.innerHTML='';for(let i=1;i<=max;i++)sel.innerHTML+=`<option value="${i}">${t==='cpu'?'ランク':'難易度'}${i}</option>`;document.getElementById('dInfo').textContent=t==='normal'?'5階層。5階ボス撃破で次のダンジョン解放。':t==='mat'?'強化素材が多めに落ちる。':t==='gold'?'ゴールドが多め。':'CPU戦。レアリティ○以上の装備推奨。'}
function enemy(t,lv,floor=1){let scale=Math.pow(1.18,lv-1)*(1+floor*.18),mul=t==='cpu'?2.2:t==='gold'?.8:t==='mat'?1.2:1;return{hp:Math.floor(80*scale*mul),atk:Math.floor(9*scale*mul),def:Math.floor(3*scale*mul),name:t==='cpu'?'CPUランク'+lv:floor===5?'ボス':'モンスター'}}
function startDungeon(){let t=dType.value,lv=+dLv.value;B={t,lv,floor:1};fight()}
function fight(){let s=stats(),e=enemy(B.t,B.lv,B.floor),php=s.hp,ehp=e.hp,turn=0;while(php>0&&ehp>0&&turn<200){turn++;let crit=Math.random()*100<s.crit?1.7:1,combo=Math.random()*100<s.combo?2:1;ehp-=Math.max(1,(s.atk*crit*combo)-e.def);if(ehp<=0)break;php-=Math.max(1,e.atk-s.def)}if(php>0){winFloor(e)}else{document.getElementById('battle').innerHTML='敗北。ホームへ転送。';document.getElementById('battleBtns').innerHTML='';msg('敗北した。')}}
function winFloor(e){let s=stats(),gold=Math.floor((40+B.lv*25)*(1+s.goldB/100)*(B.t==='gold'?5:1)),exp=Math.floor((20+B.lv*10)*(1+s.expB/100));G.gold+=gold;G.exp+=exp;let drops=[];if(B.t==='mat'||Math.random()<.35){let mi=Math.min(4,Math.floor(B.lv/8)+Math.floor(Math.random()*2));G.mat[mi]++;drops.push(matNames[mi])}if((B.floor===5&&Math.random()<.18+s.luck/1000)||(B.t==='cpu'&&Math.random()<.25)){let r=Math.min(14,Math.floor(B.lv/3)+Math.floor(Math.random()*4));let eq=makeEq(r,rnd(slots),B.t==='cpu'?'CPU':'ボス');G.equips.push(eq);G.best=Math.max(G.best,r);drops.push(`<span class="${rc(r)}">${eq.name}</span>`)}document.getElementById('battle').innerHTML=`${B.floor}階層クリア！ +${f(gold)}G +${f(exp)}EXP<br>ドロップ：${drops.join(' / ')||'なし'}`;let boss=B.floor===5;if(boss&&B.t==='normal'&&B.lv>=G.maxD){G.maxD++;msg('ノーマルダンジョン'+G.maxD+'解放！')}document.getElementById('battleBtns').innerHTML=boss||B.t!=='normal'?`<button onclick="B=null;draw()">撤退</button>`:`<button class="good" onclick="B.floor++;fight()">次へ進む</button><button onclick="B=null;draw()">撤退</button>`;trim();draw()}
function draw(){save();drawStats();drawHome();drawGacha();drawEquip();drawEnhance();renderDungeon();document.getElementById('log').innerHTML=G.log.slice(-30).reverse().join('<br>')}
function drawStats(){let s=stats();statsEl=stats;document.getElementById('stats').innerHTML=[['HP',f(s.hp)],['攻撃',f(s.atk)],['防御',f(s.def)],['運',f(s.luck)],['攻撃速度','x'+s.speed.toFixed(2)],['連撃率',s.combo.toFixed(1)+'%'],['クリ率',s.crit.toFixed(1)+'%'],['ゴールド',f(G.gold)+'G']].map(x=>`<div class="card"><div class="small">${x[0]}</div><b>${x[1]}</b></div>`).join('')}
function drawHome(){document.getElementById('homeInfo').innerHTML=`<div class="card">解放ダンジョン<br><b>${G.maxD}</b></div><div class="card">ガチャLv<br><b>${G.gLv}</b></div><div class="card">装備数<br><b>${G.equips.length}/500</b></div><div class="card">最高レア<br><b class="${rc(G.best)}">${R[G.best]}</b></div>`;document.getElementById('equipNow').innerHTML=slots.map(s=>{let e=eqBy(G.eq[s]);return`<div class="card"><b>${s}</b><br>${e?`<span class="${rc(e.rarity)}">${e.name}</span> +${e.plus}`:'なし'}</div>`}).join('')}
function drawGacha(){let r=rates(),need=needG();document.getElementById('gachaInfo').innerHTML=`ガチャLv：<b>${G.gLv}</b>　次Lv：${f(G.gExp)}/${f(need)}<div class="bar"><div style="width:${Math.min(100,G.gExp/need*100)}%"></div></div>`;document.getElementById('rates').innerHTML=r.map((x,i)=>`<tr><td class="${rc(i)}">${R[i]}</td><td>${x.toFixed(x>=1?3:6)}%</td><td>${x?('約'+f(100/x)+'回'):'-'}</td></tr>`).join('');let max=r.findLastIndex(x=>x>0),sel=document.getElementById('autoSell');sel.innerHTML='<option value="-1">なし</option>'+R.slice(0,max+1).map((x,i)=>`<option value="${i}">${x}以下</option>`).join('');if(G.autoSell>max)G.autoSell=max;sel.value=G.autoSell}
function drawEquip(){let sf=document.getElementById('slotFilter');if(!sf.innerHTML)sf.innerHTML='<option>全部</option>'+slots.map(s=>`<option>${s}</option>`).join('');let slot=sf.value,sort=document.getElementById('sort').value,used=new Set(Object.values(G.eq));let arr=G.equips.filter(e=>slot==='全部'||e.slot===slot);arr.sort((a,b)=>(sort==='rarity'?b.rarity-a.rarity:sort==='power'?pwr(b)-pwr(a):sort==='new'?b.t-a.t:(b.st[sort]||0)-(a.st[sort]||0)));document.getElementById('equipList').innerHTML=arr.map(e=>`<div class="card ${used.has(e.id)?'equipped':''}"><b class="${rc(e.rarity)}">${R[e.rarity]}</b> ${e.slot}<h3>${e.name} +${e.plus}</h3>${used.has(e.id)?'<b style="color:#ffd166">装備中</b><br>':''}${e.lock?'<b>ロック中</b><br>':''}<span class="small">HP+${f(e.st.hp)} 攻+${f(e.st.atk)} 防+${f(e.st.def)} 運+${f(e.st.luck)}<br>攻速+${e.st.speed} 連撃+${e.st.combo}% クリ+${e.st.crit}%<br>EXP+${e.st.expB}% G+${e.st.goldB}%<br>売却:${f(sellVal(e))}G</span><div class="row"><button onclick="equip(${e.id})">装備</button><button onclick="lock(${e.id})">${e.lock?'解除':'ロック'}</button><button onclick="selectEnh(${e.id})">強化</button><button class="danger" onclick="sell(${e.id})" ${used.has(e.id)||e.lock?'disabled':''}>売却</button></div></div>`).join('')||'装備なし'}
function equip(id){let e=eqBy(id);G.eq[e.slot]=id;msg(e.name+'を装備');draw()}
function lock(id){let e=eqBy(id);e.lock=!e.lock;draw()}
function sell(id){let e=eqBy(id);if(!confirm(e.name+'を売却？'))return;G.gold+=sellVal(e);G.equips=G.equips.filter(x=>x.id!==id);draw()}
function bulkSell(){let n=+prompt('何番以下を売却？\n0ノーマル 1レア 2ハイレア 3S 4SS 5エピック 6レジェンド 7ミシック 8ゴッド 9エンシェント 10ファントム 11カオス 12セレスティアル 13インフィニティ 14オリジン');if(isNaN(n))return;let used=new Set(Object.values(G.eq)),target=G.equips.filter(e=>e.rarity<=n&&!used.has(e.id)&&!e.lock),gold=target.reduce((a,e)=>a+sellVal(e),0);if(confirm(`${R[n]}以下を${target.length}個売却して${f(gold)}G獲得する？`)){G.gold+=gold;G.equips=G.equips.filter(e=>!target.includes(e));draw()}}
function drawEnhance(){document.getElementById('mats').innerHTML=matNames.map((m,i)=>`<div class="card">${m}: <b>${G.mat[i]}</b></div>`).join('');let sel=document.getElementById('enhanceSel');let cur=sel.value;sel.innerHTML=G.equips.map(e=>`<option value="${e.id}">${R[e.rarity]} ${e.slot} ${e.name} +${e.plus}</option>`).join('');if(cur)sel.value=cur;let e=eqBy(+sel.value);if(!e){document.getElementById('enhanceBox').innerHTML='装備なし';return}let mi=Math.min(4,Math.floor(e.rarity/3)),need=1+Math.floor(e.plus/5),rate=Math.max(35,100-e.plus*3);document.getElementById('enhanceBox').innerHTML=`<div class="card"><b class="${rc(e.rarity)}">${e.name}</b> +${e.plus}<br>必要:${matNames[mi]} x${need}<br>成功率:${rate}%<br>現在倍率:x${emul(e.plus).toFixed(2)} → x${emul(e.plus+1).toFixed(2)}<br><button class="good" onclick="enhance(${e.id})">強化</button></div>`}
function enhance(id){let e=eqBy(id),mi=Math.min(4,Math.floor(e.rarity/3)),need=1+Math.floor(e.plus/5),rate=Math.max(35,100-e.plus*3);if(G.mat[mi]<need)return alert('素材不足');G.mat[mi]-=need;if(Math.random()*100<rate){e.plus++;msg(e.name+' 強化成功 +'+e.plus)}else msg(e.name+' 強化失敗。強化値は維持');draw()}
function selectEnh(id){show('enhance',document.querySelectorAll('.tab')[4]);document.getElementById('enhanceSel').value=id;drawEnhance()}
function msg(t){G.log.push(t);save()} function glog(t){document.getElementById('gachaLog').innerHTML=t+'<hr>'+document.getElementById('gachaLog').innerHTML}
window.addEventListener('beforeunload',save);draw();
</script>
</body>
</html>
