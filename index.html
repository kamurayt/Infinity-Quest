<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>インフレーションRPG</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #111;
    color: white;
    text-align: center;
  }
  .game {
    max-width: 430px;
    margin: auto;
    padding: 16px;
  }
  .box {
    background: #222;
    border: 2px solid #444;
    border-radius: 12px;
    padding: 14px;
    margin: 10px 0;
  }
  button {
    width: 100%;
    padding: 14px;
    margin: 6px 0;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #4caf50;
    color: white;
    font-weight: bold;
  }
  button:active {
    transform: scale(0.97);
  }
  .danger {
    background: #e53935;
  }
  .gold {
    color: #ffd54f;
  }
  .hpbar {
    width: 100%;
    height: 22px;
    background: #555;
    border-radius: 12px;
    overflow: hidden;
  }
  .hp {
    height: 100%;
    background: #e53935;
    width: 100%;
  }
</style>
</head>
<body>

<div class="game">
  <h1>インフレーションRPG</h1>

  <div class="box">
    <h2>プレイヤー</h2>
    <p>Lv：<span id="level">1</span></p>
    <p>経験値：<span id="exp">0</span> / <span id="needExp">10</span></p>
    <p>攻撃力：<span id="atk">10</span></p>
    <p class="gold">ゴールド：<span id="gold">0</span>G</p>
  </div>

  <div class="box">
    <h2>ステージ <span id="stage">1</span></h2>
    <h3 id="enemyName">スライム</h3>
    <p>敵HP：<span id="enemyHp">30</span> / <span id="enemyMaxHp">30</span></p>
    <div class="hpbar">
      <div class="hp" id="enemyHpBar"></div>
    </div>
  </div>

  <div class="box">
    <button onclick="attackEnemy()">攻撃する</button>
    <button onclick="autoBattle()">10回攻撃</button>
    <button onclick="upgradeAtk()">攻撃力強化</button>
    <button class="danger" onclick="resetGame()">データリセット</button>
  </div>

  <div class="box">
    <p id="log">冒険開始！</p>
  </div>
</div>

<script>
let player = {
  level: 1,
  exp: 0,
  needExp: 10,
  atk: 10,
  gold: 0,
  stage: 1
};

let enemy = {
  name: "スライム",
  hp: 30,
  maxHp: 30
};

function format(num) {
  if (num >= 100000000) return (num / 100000000).toFixed(2) + "億";
  if (num >= 10000) return (num / 10000).toFixed(2) + "万";
  return Math.floor(num);
}

function createEnemy() {
  let isBoss = player.stage % 10 === 0;

  enemy.maxHp = Math.floor(30 * Math.pow(1.25, player.stage - 1));

  if (isBoss) {
    enemy.name = "ボスモンスター";
    enemy.maxHp *= 5;
  } else {
    enemy.name = "モンスター";
  }

  enemy.hp = enemy.maxHp;
}

function attackEnemy() {
  enemy.hp -= player.atk;

  if (enemy.hp <= 0) {
    defeatEnemy();
  }

  update();
  saveGame();
}

function autoBattle() {
  for (let i = 0; i < 10; i++) {
    attackEnemy();
  }
}

function defeatEnemy() {
  let expGain = Math.floor(5 * Math.pow(1.18, player.stage));
  let goldGain = Math.floor(3 * Math.pow(1.15, player.stage));

  if (player.stage % 10 === 0) {
    expGain *= 5;
    goldGain *= 5;
  }

  player.exp += expGain;
  player.gold += goldGain;

  document.getElementById("log").innerText =
    enemy.name + "を倒した！ 経験値+" + format(expGain) + " / ゴールド+" + format(goldGain);

  while (player.exp >= player.needExp) {
    player.exp -= player.needExp;
    player.level++;
    player.atk = Math.floor(player.atk * 1.18 + 5);
    player.needExp = Math.floor(player.needExp * 1.35);
  }

  player.stage++;
  createEnemy();
}

function upgradeAtk() {
  let cost = Math.floor(20 * Math.pow(1.3, player.level));

  if (player.gold >= cost) {
    player.gold -= cost;
    player.atk = Math.floor(player.atk * 1.25 + 10);
    document.getElementById("log").innerText =
      "攻撃力を強化した！ -" + format(cost) + "G";
  } else {
    document.getElementById("log").innerText =
      "ゴールドが足りない！ 必要：" + format(cost) + "G";
  }

  update();
  saveGame();
}

function update() {
  document.getElementById("level").innerText = player.level;
  document.getElementById("exp").innerText = format(player.exp);
  document.getElementById("needExp").innerText = format(player.needExp);
  document.getElementById("atk").innerText = format(player.atk);
  document.getElementById("gold").innerText = format(player.gold);
  document.getElementById("stage").innerText = player.stage;

  document.getElementById("enemyName").innerText = enemy.name;
  document.getElementById("enemyHp").innerText = format(Math.max(enemy.hp, 0));
  document.getElementById("enemyMaxHp").innerText = format(enemy.maxHp);

  let hpRate = Math.max(enemy.hp / enemy.maxHp * 100, 0);
  document.getElementById("enemyHpBar").style.width = hpRate + "%";
}

function saveGame() {
  localStorage.setItem("inflationRpgSave", JSON.stringify(player));
}

function loadGame() {
  let save = localStorage.getItem("inflationRpgSave");
  if (save) {
    player = JSON.parse(save);
  }
  createEnemy();
  update();
}

function resetGame() {
  if (confirm("本当にデータをリセットする？")) {
    localStorage.removeItem("inflationRpgSave");
    location.reload();
  }
}

loadGame();
</script>

</body>
</html>
